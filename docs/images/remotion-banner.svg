<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0c1527" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="slightGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseRing {
        0% { r: 60px; opacity: 0.8; }
        50% { r: 90px; opacity: 0.2; }
        100% { r: 120px; opacity: 0; }
      }
      @keyframes floatHeadset {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
      }
      @keyframes dashAnim {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes textShine {
        0% { stop-color: #00f0ff; }
        50% { stop-color: #38bdf8; }
        100% { stop-color: #00f0ff; }
      }
      .headset-group {
        animation: floatHeadset 6s ease-in-out infinite;
        transform-origin: 980px 200px;
      }
      .pulse-1 {
        animation: pulseRing 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .pulse-2 {
        animation: pulseRing 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 1.5s;
      }
      .ekg-line {
        stroke-dasharray: 1000;
        animation: dashAnim 5s linear infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="180" fill="rgba(0, 240, 255, 0.06)" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="220" fill="rgba(37, 99, 235, 0.08)" filter="url(#glow)" />
  <circle cx="600" cy="200" r="140" fill="rgba(16, 185, 129, 0.05)" filter="url(#glow)" />

  <!-- Left Content: Branding & Typography -->
  <g transform="translate(80, 80)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="rgba(0, 240, 255, 0.1)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      MIXED REALITY NEURO-REHAB
    </text>

    <!-- Main Title -->
    <text x="0" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
      Re<tspan fill="url(#cyanGlow)">Motion</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="150" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
      Immersive AR/VR Motor Rehabilitation Platform
    </text>

    <text x="0" y="180" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      MediaPipe 21-Landmark Optical Tracking • 4 Isolated Clinical Portals • Real WebRTC Telehealth
    </text>

    <!-- Telemetry Feature Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="28" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(51, 65, 85, 0.8)" />
      <text x="14" y="18" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="600">● 60 FPS Optical</text>

      <!-- Pill 2 -->
      <rect x="140" y="0" width="125" height="28" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(51, 65, 85, 0.8)" />
      <text x="154" y="18" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">● WebXR 6-DoF</text>

      <!-- Pill 3 -->
      <rect x="275" y="0" width="135" height="28" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(51, 65, 85, 0.8)" />
      <text x="289" y="18" fill="#10b981" font-family="monospace" font-size="11" font-weight="600">● 22 VR Games</text>

      <!-- Pill 4 -->
      <rect x="420" y="0" width="145" height="28" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(51, 65, 85, 0.8)" />
      <text x="434" y="18" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="600">● Live Goniometer</text>
    </g>
  </g>

  <!-- Live Biometric Waveform / Pulse Stream across bottom -->
  <path class="ekg-line" d="M 0 350 L 300 350 L 320 320 L 335 380 L 350 330 L 365 365 L 380 350 L 700 350 L 720 310 L 740 390 L 760 335 L 780 365 L 800 350 L 1200 350"
        fill="none" stroke="rgba(0, 240, 255, 0.35)" stroke-width="2.5" />

  <!-- Right Visual: Stylized 3D Mixed Reality Headset Graphic with Expanding Explosion Vectors -->
  <g class="headset-group">
    <!-- Radar Pulse Rings -->
    <circle class="pulse-1" cx="960" cy="200" r="60" fill="none" stroke="#00f0ff" stroke-width="1.5" />
    <circle class="pulse-2" cx="960" cy="200" r="60" fill="none" stroke="#3b82f6" stroke-width="1.5" />

    <!-- Headset Strap Back Ring -->
    <ellipse cx="960" cy="200" rx="160" ry="85" fill="none" stroke="rgba(100, 116, 139, 0.4)" stroke-width="10" stroke-dasharray="14 10" />

    <!-- Headset Main Visor Body -->
    <rect x="850" y="145" width="220" height="110" rx="36" fill="#0f172a" stroke="#00f0ff" stroke-width="2.5" filter="url(#slightGlow)" />

    <!-- Curved Front Glass Shield -->
    <path d="M 865 160 Q 960 175 1055 160 Q 1060 210 1055 240 Q 960 225 865 240 Z" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.6)" stroke-width="1.5" />

    <!-- Dual Optical Eye Lenses -->
    <circle cx="915" cy="200" r="26" fill="#020617" stroke="#38bdf8" stroke-width="2" />
    <circle cx="915" cy="200" r="14" fill="#00f0ff" opacity="0.8" filter="url(#glow)" />
    <circle cx="1005" cy="200" r="26" fill="#020617" stroke="#38bdf8" stroke-width="2" />
    <circle cx="1005" cy="200" r="14" fill="#00f0ff" opacity="0.8" filter="url(#glow)" />

    <!-- Passthrough Optical Cameras (6-DoF Array) -->
    <circle cx="875" cy="165" r="4.5" fill="#10b981" />
    <circle cx="1045" cy="165" r="4.5" fill="#10b981" />
    <circle cx="875" cy="235" r="4.5" fill="#10b981" />
    <circle cx="1045" cy="235" r="4.5" fill="#10b981" />

    <!-- Exploded Component Satellite Chips Floating Along 3D Vectors -->
    <!-- Display Panel -->
    <g transform="translate(800, 90)">
      <rect width="60" height="35" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="8" y="22" fill="#93c5fd" font-family="monospace" font-size="9" font-weight="700">OLED 4K</text>
      <line x1="60" y1="20" x2="90" y2="70" stroke="rgba(56, 189, 248, 0.4)" stroke-dasharray="2 2" stroke-width="1" />
    </g>

    <!-- Compute Module -->
    <g transform="translate(1060, 80)">
      <rect width="70" height="35" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="8" y="22" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="700">XR2 Core</text>
      <line x1="20" y1="35" x2="-20" y2="80" stroke="rgba(16, 185, 129, 0.4)" stroke-dasharray="2 2" stroke-width="1" />
    </g>

    <!-- IMU & Biofeedback -->
    <g transform="translate(1080, 270)">
      <rect width="75" height="35" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="8" y="22" fill="#fde68a" font-family="monospace" font-size="9" font-weight="700">6-DoF IMU</text>
      <line x1="10" y1="0" x2="-30" y2="-50" stroke="rgba(245, 158, 11, 0.4)" stroke-dasharray="2 2" stroke-width="1" />
    </g>

    <!-- Optical Sensor Ring -->
    <g transform="translate(770, 260)">
      <rect width="80" height="35" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
      <text x="8" y="22" fill="#fbcfe8" font-family="monospace" font-size="9" font-weight="700">MediaPipe</text>
      <line x1="80" y1="10" x2="110" y2="-40" stroke="rgba(236, 72, 153, 0.4)" stroke-dasharray="2 2" stroke-width="1" />
    </g>
  </g>
</svg>
